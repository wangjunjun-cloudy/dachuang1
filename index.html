<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>职业身份模拟器</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">

    <!-- ========== 页面1：注册 / 登录 ========== -->
    <section id="page-auth" class="page active">
      <div class="auth-card">
        <h1>🎭 职业身份模拟器</h1>
        <p class="subtitle">大创赛作品 · 体验不同职业的真实困境</p>

        <div class="tab-bar">
          <button class="tab-btn active" data-tab="login">登录</button>
          <button class="tab-btn" data-tab="register">注册</button>
        </div>

        <form id="form-login" class="auth-form">
          <input type="text" id="login-username" placeholder="用户名" required>
          <input type="password" id="login-password" placeholder="密码" required>
          <button type="submit" class="btn-primary">登 录</button>
        </form>

        <form id="form-register" class="auth-form hidden">
          <input type="text" id="reg-username" placeholder="用户名" required>
          <input type="password" id="reg-password" placeholder="密码" required>
          <input type="text" id="reg-realname" placeholder="真实姓名（可选）">
          <button type="submit" class="btn-primary">注 册</button>
        </form>

        <p class="hint">管理员账号：admin / admin123</p>
      </div>
    </section>

    <!-- ========== 页面2：答题 ========== -->
    <section id="page-quiz" class="page">
      <div class="quiz-card">
        <div class="quiz-header">
          <span id="quiz-identity-label">身份：医学生</span>
          <span id="quiz-progress">1 / 3</span>
        </div>

        <div id="quiz-scene" class="scene-box">
          <p id="scene-text"></p>
        </div>

        <div id="quiz-question-area">
          <p class="question-text" id="question-text"></p>
          <textarea id="answer-input" rows="5" placeholder="请输入你的回答…"></textarea>
        </div>

        <div class="quiz-footer">
          <button id="btn-prev" class="btn-secondary" disabled>上一题</button>
          <button id="btn-next" class="btn-primary">下一题</button>
          <button id="btn-submit" class="btn-primary hidden">提 交</button>
        </div>
      </div>
    </section>

    <!-- ========== 页面2-结果：分数 + 五维图 ========== -->
    <section id="page-result" class="page">
      <div class="result-card">
        <h2>📊 评估结果</h2>
        <div id="result-identity" class="result-identity"></div>
        <div class="chart-wrap">
          <canvas id="radar-chart"></canvas>
        </div>
        <div id="result-eval" class="result-eval"></div>
        <div id="result-score" class="result-score"></div>
        <button id="btn-back-home" class="btn-primary">返回主页</button>
      </div>
    </section>

    <!-- ========== 页面3：主页 / 记录 / 管理 ========== -->
    <section id="page-home" class="page">
      <div class="home-card">
        <div class="user-bar">
          <div class="avatar" id="user-avatar">U</div>
          <div>
            <div id="user-name" class="user-name"></div>
            <div id="user-greeting" class="user-greeting"></div>
          </div>
        </div>

        <h3>选择身份开始模拟</h3>
        <div class="identity-grid" id="identity-grid"></div>

        <h3>答题记录</h3>
        <div id="record-list" class="record-list">
          <p class="empty-hint">暂无记录</p>
        </div>

        <div id="admin-panel" class="admin-panel hidden">
          <h3>🔧 管理员入口</h3>
          <p>当前注册用户：<span id="admin-user-count">0</span></p>
          <p>总答题记录：<span id="admin-record-count">0</span></p>
          <div id="admin-table-wrap" class="admin-table-wrap"></div>
          <button id="btn-clear-all" class="btn-danger">清空所有数据</button>
        </div>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
